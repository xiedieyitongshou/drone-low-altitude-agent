name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_deepseek:
        description: Run opt-in real DeepSeek regression (requires DEEPSEEK_API_KEY secret)
        type: boolean
        default: false
      deepseek_model:
        description: DeepSeek model; leave blank to use DEEPSEEK_EVAL_MODEL repository variable
        type: string
        default: ""

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      AGENT_RUNTIME_MODE: loop
      DATABASE_URL: sqlite:///./data/ci-test.db
      SESSION_MEMORY_BACKEND: ttlcache
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Run fast Agent and RAG eval gates
        run: python -m pytest -m eval_fast -q

      - name: Prepare Docker Compose env file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose --profile test --profile eval --profile tools config --quiet

  postgres-api-test:
    name: PostgreSQL API regression tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_api
          POSTGRES_USER: ci_api_user
          POSTGRES_PASSWORD: ci_api_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_api_user -d ci_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci_api_user:ci_api_password@127.0.0.1:5432/ci_api
      IDEMPOTENCY_TEST_DATABASE_URL: postgresql+psycopg://ci_api_user:ci_api_password@127.0.0.1:5432/ci_api
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL API regression tests
        run: >-
          python -m pytest -q --api-db=postgresql
          tests/test_auth_api.py
          tests/test_user_profile_api.py
          tests/test_conversation_history_api.py
          tests/test_history_rule_snapshot.py
          tests/test_mission_task_execution_api.py::test_task_evaluation_readback_and_cancellation
          tests/test_mission_task_execution_api.py::test_task_evaluation_history_requires_task_visibility
          tests/test_session_memory.py::test_default_database_sessions_restore_latest_context_by_user
          tests/test_session_memory.py::test_session_cleanup_checks_last_write_and_keeps_chat_history
          tests/test_task_creation_idempotency.py
          tests/test_mission_task_versioning.py
          tests/test_knowledge_publication_recovery.py::test_metadata_recovery_uses_selected_api_database
          tests/test_execution_budget.py
          tests/test_tool_executor.py

  frontend-test:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Test submission recovery and task versions
        run: npm test

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Test task cancellation in the browser
        run: npm run test:e2e

      - name: Build frontend
        run: npm run build

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-failures
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7

  session-reliability:
    name: Session persistence and recovery
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SESSION_RELIABILITY_IMAGE: drone-low-altitude-agent:session-ci
      SESSION_RELIABILITY_PROJECT: session-reliability-ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build isolated Session test image
        run: docker build -t "$SESSION_RELIABILITY_IMAGE" .

      - name: Run Session persistence regression scenarios
        if: github.event_name != 'workflow_dispatch'
        run: >-
          python scripts/session_reliability_eval.py --profile smoke
          --image "$SESSION_RELIABILITY_IMAGE" --project "$SESSION_RELIABILITY_PROJECT"
          --output data/eval-reports/session-reliability/ci

      - name: Run complete Session fault scenarios
        if: github.event_name == 'workflow_dispatch'
        run: >-
          python scripts/session_reliability_eval.py --profile full
          --image "$SESSION_RELIABILITY_IMAGE" --project "$SESSION_RELIABILITY_PROJECT"
          --output data/eval-reports/session-reliability/ci

      - name: Collect Session logs and clean up test resources
        if: always()
        run: |
          mkdir -p data/eval-reports/session-reliability/ci
          docker compose -f docker/session_reliability.compose.yml -p "$SESSION_RELIABILITY_PROJECT" logs --no-color --timestamps > data/eval-reports/session-reliability/ci/runner-container-logs.txt 2>&1 || true
          docker compose -f docker/session_reliability.compose.yml -p "$SESSION_RELIABILITY_PROJECT" down --volumes --remove-orphans

      - name: Upload Session evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: session-reliability-evidence
          path: data/eval-reports/session-reliability/ci/
          retention-days: 14

  full-eval:
    name: Full eval reports
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    env:
      AGENT_RUNTIME_MODE: loop
      DATABASE_URL: sqlite:///./data/ci-full-eval.db
      SESSION_MEMORY_BACKEND: ttlcache
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Generate full eval reports
        run: |
          status=0
          python scripts/tool_calling_eval.py || status=1
          python scripts/multi_turn_state_eval.py || status=1
          python scripts/failure_recovery_eval.py || status=1
          python scripts/rag_eval.py || status=1
          python -m pytest -m eval_fast -q || status=1
          exit "$status"

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/

  deepseek-regression:
    name: Real DeepSeek regression
    if: github.event_name == 'workflow_dispatch' && inputs.run_deepseek
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      LLM_MODEL: ${{ inputs.deepseek_model || vars.DEEPSEEK_EVAL_MODEL }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run isolated real DeepSeek regression
        run: python scripts/deepseek_regression_eval.py --report-dir data/eval-reports/deepseek

      - name: Upload DeepSeek evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-regression-evidence
          path: data/eval-reports/deepseek/
          retention-days: 14
