name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-test:
    name: Backend tests
    runs-on: ubuntu-latest

    env:
      AGENT_RUNTIME_MODE: loop
      DATABASE_URL: sqlite:///./data/ci-test.db
      SESSION_MEMORY_BACKEND: ttlcache
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Run backend test suite
        run: python -m pytest -q

      - name: Run fast Agent and RAG eval gates
        run: python -m pytest -m eval_fast -q

      - name: Prepare Docker Compose env file
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose --profile test --profile eval --profile tools config --quiet

  postgres-api-test:
    name: PostgreSQL API regression tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci_api
          POSTGRES_USER: ci_api_user
          POSTGRES_PASSWORD: ci_api_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci_api_user -d ci_api"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://ci_api_user:ci_api_password@127.0.0.1:5432/ci_api
      IDEMPOTENCY_TEST_DATABASE_URL: postgresql+psycopg://ci_api_user:ci_api_password@127.0.0.1:5432/ci_api
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run PostgreSQL migrations
        run: python -m alembic upgrade head

      - name: Run PostgreSQL API regression tests
        run: >-
          python -m pytest -q --api-db=postgresql
          tests/test_auth_api.py
          tests/test_user_profile_api.py
          tests/test_conversation_history_api.py
          tests/test_history_rule_snapshot.py
          tests/test_mission_task_execution_api.py::test_task_evaluation_readback_and_cancellation
          tests/test_mission_task_execution_api.py::test_task_evaluation_history_requires_task_visibility
          tests/test_session_memory.py::test_default_database_sessions_restore_latest_context_by_user
          tests/test_session_memory.py::test_session_cleanup_checks_last_write_and_keeps_chat_history
          tests/test_task_creation_idempotency.py

  frontend-test:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Test pending submission recovery
        run: npm test

      - name: Build frontend
        run: npm run build

  full-eval:
    name: Full eval reports
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    env:
      AGENT_RUNTIME_MODE: loop
      DATABASE_URL: sqlite:///./data/ci-full-eval.db
      SESSION_MEMORY_BACKEND: ttlcache
      LLM_ENABLED: "false"
      NL_PARSER_MODE: rule
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run database migrations
        run: python -m alembic upgrade head

      - name: Generate full eval reports
        run: |
          python scripts/tool_calling_eval.py
          python scripts/multi_turn_state_eval.py
          python scripts/failure_recovery_eval.py
          python scripts/rag_eval.py

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
