x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL:-}
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-drone_agent}
  POSTGRES_USER: ${POSTGRES_USER:-drone_agent}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-60000}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmjs.org/}
    container_name: drone-agent-frontend
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    container_name: drone-agent-api
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      APP_PORT: 8000
      TZ: Asia/Shanghai
      <<: *database-environment
      SESSION_MEMORY_BACKEND: ${SESSION_MEMORY_BACKEND:-database}
      REDIS_URL: redis://redis:6379/0
      SESSION_MEMORY_TTL_SECONDS: ${SESSION_MEMORY_TTL_SECONDS:-}
      ANONYMOUS_SESSION_TTL_SECONDS: ${ANONYMOUS_SESSION_TTL_SECONDS:-1800}
      SESSION_MEMORY_REDIS_KEY_PREFIX: ${SESSION_MEMORY_REDIS_KEY_PREFIX:-drone_agent:session:}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      NL_PARSER_MODE: ${NL_PARSER_MODE:-rule}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-loop}
      AGENT_LOG_RAW_PAYLOAD: ${AGENT_LOG_RAW_PAYLOAD:-false}
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
      KNOWLEDGE_EMBEDDING_MIN_SCORE: ${KNOWLEDGE_EMBEDDING_MIN_SCORE:-0.25}
      RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD:-0.2}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-init:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - tools
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-loop}
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
    volumes:
      - ./data:/app/data
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic upgrade head && python scripts/create_initial_admin.py"]
    depends_on:
      postgres:
        condition: service_healthy

  knowledge-import:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - tools
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
    volumes:
      - ./data:/app/data
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic upgrade head && python scripts/import_knowledge_json.py --path \"$${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}\""]
    depends_on:
      postgres:
        condition: service_healthy

  knowledge-reindex:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - tools
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
    volumes:
      - ./data:/app/data
    entrypoint: ["sh", "-c"]
    command:
      - |
        python -m alembic upgrade head && python - <<'PY'
        from app.core.config import load_environment
        from app.db.session import SessionLocal
        from app.services.admin_knowledge_indexing import reindex_knowledge_documents

        load_environment()
        with SessionLocal() as db:
            job = reindex_knowledge_documents(db=db)
            print(
                "Knowledge reindex completed: "
                f"status={job.status}, documents={job.document_count}, chunks={job.chunk_count}, error={job.error_message}"
            )
            if job.status != "success":
                raise SystemExit(1)
        PY
    depends_on:
      postgres:
        condition: service_healthy

  backend-tests:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - test
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      SESSION_MEMORY_BACKEND: ttlcache
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-loop}
      NL_PARSER_MODE: ${NL_PARSER_MODE:-rule}
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
      RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD:-0.2}
    volumes:
      - ./data:/app/data
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic upgrade head && python -m pytest -q"]
    depends_on:
      postgres:
        condition: service_healthy

  eval-fast:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - eval
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      SESSION_MEMORY_BACKEND: ttlcache
      AGENT_RUNTIME_MODE: loop
      NL_PARSER_MODE: rule
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      KNOWLEDGE_RETRIEVER: hybrid
      RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD:-0.2}
    volumes:
      - ./data:/app/data
      - ./evals/reports:/app/evals/reports
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic upgrade head && python -m pytest -m eval_fast -q"]
    depends_on:
      postgres:
        condition: service_healthy

  eval-full:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    profiles:
      - eval
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-docker}
      TZ: Asia/Shanghai
      <<: *database-environment
      SESSION_MEMORY_BACKEND: ttlcache
      AGENT_RUNTIME_MODE: loop
      NL_PARSER_MODE: rule
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_SOURCE_PATH: ${KNOWLEDGE_SOURCE_PATH:-}
      RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD:-0.2}
    volumes:
      - ./data:/app/data
      - ./evals/reports:/app/evals/reports
    entrypoint: ["sh", "-c"]
    command:
      - |
        python -m alembic upgrade head
        python scripts/tool_calling_eval.py
        python scripts/multi_turn_state_eval.py
        python scripts/failure_recovery_eval.py
        python scripts/rag_eval.py
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: drone-agent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-drone_agent}
      POSTGRES_USER: ${POSTGRES_USER:-drone_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-postgres-password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "max_connections=20"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-drone_agent} -d $${POSTGRES_DB:-drone_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: drone-agent-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
