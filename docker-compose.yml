services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8000
        VITE_API_TIMEOUT_MS: ${VITE_API_TIMEOUT_MS:-60000}
    container_name: drone-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drone-agent-api
    env_file:
      - .env
    environment:
      APP_ENV: docker
      APP_PORT: 8000
      TZ: Asia/Shanghai
      DATABASE_URL: sqlite:///./data/drone_agent.db
      SESSION_MEMORY_BACKEND: redis
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      LLM_ENABLED: ${LLM_ENABLED:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-20}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-600}
      NL_PARSER_MODE: ${NL_PARSER_MODE:-rule}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-loop}
      AGENT_LOG_RAW_PAYLOAD: ${AGENT_LOG_RAW_PAYLOAD:-false}
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
      KNOWLEDGE_EMBEDDING_MIN_SCORE: ${KNOWLEDGE_EMBEDDING_MIN_SCORE:-0.25}
      RAG_CONFIDENCE_THRESHOLD: ${RAG_CONFIDENCE_THRESHOLD:-0.2}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  admin-init:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - tools
    env_file:
      - .env
    environment:
      APP_ENV: docker
      TZ: Asia/Shanghai
      DATABASE_URL: sqlite:///./data/drone_agent.db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      AGENT_RUNTIME_MODE: ${AGENT_RUNTIME_MODE:-loop}
      ADVICE_KNOWLEDGE_PATH: ${ADVICE_KNOWLEDGE_PATH:-data/knowledge/advice_rules.json}
      KNOWLEDGE_RETRIEVER: ${KNOWLEDGE_RETRIEVER:-bm25}
    volumes:
      - ./data:/app/data
    entrypoint: ["sh", "-c"]
    command: ["python -m alembic upgrade head && python scripts/create_initial_admin.py"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: drone-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
